{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<section class="tarjeta tarjeta-estrecha">
  <h1>{{ titulo }}</h1>
  <p>{{ mensaje }}</p>
  <form method="post">
    {% csrf_token %}
    <div class="acciones">
      <button type="submit" class="boton boton-peligro">{{ boton|default:"Confirmar" }}</button>
      <a class="boton boton-secundario" href="{{ volver }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
